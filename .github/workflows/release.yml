name: Release

# Push a tag like v0.1.0 to publish the community image (AGPL core only, no
# ee/) for amd64 and arm64 to Docker Hub and GHCR.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access
# token with write access to elrumo/helpbites). GHCR uses the built-in token.

on:
  push:
    tags: ['v*']

env:
  IMAGE: elrumo/helpbites

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ env.IMAGE }}
            ghcr.io/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HELPBITES_EDITION=community
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must not contain the commercial layer
        run: |
          docker run --rm --entrypoint sh ghcr.io/${{ env.IMAGE }}:latest -c 'test ! -e /app/ee'
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: elrumo/helpbites
          readme-filepath: ./README.md
