name: Edge image

# Every push to main publishes the community image to Docker Hub as :edge and
# :sha-<short>. Tagged releases (:latest, :x.y.z) stay in release.yml.
# Uses the same secrets as release.yml.

on:
  push:
    branches: [main]

env:
  IMAGE: elrumo/helpbites

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # ponytail: amd64 only; add linux/arm64 (+ setup-qemu-action) if you deploy on ARM.
          platforms: linux/amd64
          push: true
          build-args: |
            HELPBITES_EDITION=community
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
