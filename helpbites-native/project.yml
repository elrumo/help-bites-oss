name: HelpBitesNative
options:
  bundleIdPrefix: com.helpbites
  developmentLanguage: en
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # The release (kept equal to package.json by tests/versionParity.test.ts).
    MARKETING_VERSION: 0.3.1
    SWIFT_STRICT_CONCURRENCY: complete
    # Panel languages (i18n/locales): the catalog App/Localizable.xcstrings holds every string.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Release:
      # Fast launch and a small binary: optimise the whole module at once, strip dead code
      # and unused symbols, and let the linker see across files.
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      LLVM_LTO: YES_THIN
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
targets:
  HelpBitesNative:
    type: application
    platform: iOS
    # One target, three native destinations (iPhone, iPad, Mac). No Catalyst.
    supportedDestinations: [iOS, macOS]
    sources: [App]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpbites.operator
        DEVELOPMENT_TEAM: ""  # your Apple team ID
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_CFBundleDisplayName: HelpBites
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HelpBitesNative.entitlements
        # The Mac build takes its entitlements (sandbox, network, file access) from the
        # ENABLE_* settings above. APNs on the Mac needs a provisioned team: add
        # com.apple.developer.aps-environment to a Mac entitlements file once DEVELOPMENT_TEAM is set.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ""
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
    entitlements:
      path: App/HelpBitesNative.entitlements
      properties:
        aps-environment: development
        # Shared with the share extension: the session token (as a keychain access group), the server and the workspace.
        com.apple.security.application-groups: [group.com.helpbites.operator]
    dependencies:
      # The "Add to Planning" share sheet, iPhone and iPad only.
      - target: HelpBitesShare
        embed: true
        platformFilter: iOS

  HelpBitesShare:
    type: app-extension
    platform: iOS
    sources:
      - HelpBitesShare
      # The session and shared-defaults plumbing the app also compiles.
      - App/Core/SharedCredentials.swift
      - App/Core/BoardTitle.swift
      - App/Core/PickedMovie.swift
      # The offline outbox and response cache the share sheet writes and the app reads.
      - App/Core/JSONValue.swift
      - App/Core/PlanningOutbox.swift
      - App/Core/ResponseCache.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpbites.operator.share
        CURRENT_PROJECT_VERSION: '1'
        DEVELOPMENT_TEAM: ""  # the same team ID as the app
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelpBitesShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HelpBitesShare/HelpBitesShare.entitlements
        # NSItemProvider is not Sendable, so the sheet that reads what was shared stays in Swift 5 mode.
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
    entitlements:
      path: HelpBitesShare/HelpBitesShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.helpbites.operator]

# Declared here so `xcodegen generate` regenerates the shared scheme instead of
# deleting it. Run is Release with no debugger, as in the hand-made scheme.
schemes:
  HelpBitesNative:
    build:
      targets:
        HelpBitesNative: all
    run:
      config: Release
      debugEnabled: false
