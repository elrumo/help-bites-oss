name: HelpBitesNative
options:
  bundleIdPrefix: com.helpbites
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  HelpBitesNative:
    type: application
    platform: iOS
    # One target, three native destinations (iPhone, iPad, Mac). No Catalyst.
    supportedDestinations: [iOS, macOS]
    sources: [App]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpbites.operator
        DEVELOPMENT_TEAM: ""  # your Apple team ID
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_CFBundleDisplayName: HelpBites
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HelpBitesNative.entitlements
        # The Mac build takes its entitlements (sandbox, network, file access) from the
        # ENABLE_* settings above. APNs on the Mac needs a provisioned team: add
        # com.apple.developer.aps-environment to a Mac entitlements file once DEVELOPMENT_TEAM is set.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ""
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
    entitlements:
      path: App/HelpBitesNative.entitlements
      properties:
        aps-environment: development

# Declared here so `xcodegen generate` regenerates the shared scheme instead of
# deleting it. Run is Release with no debugger, as in the hand-made scheme.
schemes:
  HelpBitesNative:
    build:
      targets:
        HelpBitesNative: all
    run:
      config: Release
      debugEnabled: false
